name: panels

on:
  schedule:
    - cron: "17 21 * * *" # 00:17 in Türkiye
  workflow_dispatch:
  push:
    branches: [main]
    paths: [assets/make_fight.py, assets/make_disco.py, assets/portrait.jpg, assets/contrib.py, .github/workflows/panels.yml]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 assets/make_fight.py dist && python3 assets/make_disco.py dist
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Push to the output branch
        working-directory: dist
        run: |
          git init -q -b output
          git add .
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "panels $(date -u +%F)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" output
