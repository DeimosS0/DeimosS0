<style>
  .k0 { --c: #2dd4bf; } .k1 { --c: #fbbf24; } .k2 { --c: #a78bfa; }
  .t { font: 800 70px 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; fill: #e6edf3; text-anchor: middle; }
  .moon { fill: #a78bfa; animation: drop .9s cubic-bezier(.34,1.7,.5,1) 1.1s both; }
  .sub { font: 400 19px 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; fill: #9198a1; }
  .tag { font: 400 14px ui-monospace, 'SF Mono', 'Cascadia Code', Consolas, monospace; fill: #9198a1; letter-spacing: 1.5px; }
  .lbl { font: 500 13px ui-monospace, 'SF Mono', 'Cascadia Code', Consolas, monospace; fill: var(--c); text-anchor: middle; letter-spacing: 1px; }
  .p { fill: var(--c); animation: settle 2.2s cubic-bezier(.22,.9,.24,1) both; }
  .ring { fill: none; stroke: var(--c); stroke-width: 1.5; stroke-dasharray: 3 5; opacity: .75; }
  .mark { animation: pop .5s ease-out both; transform-box: fill-box; transform-origin: center; }
  .in { animation: rise .9s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes settle {
    0% { transform: translate(var(--dx), var(--dy)); fill: #3d444d; opacity: 0; }
    15% { opacity: 1; }
    55% { fill: #3d444d; }
    100% { transform: translate(0, 0); }
  }
  @keyframes drop { from { opacity: 0; transform: translateY(-70px); } 30% { opacity: 1; } to { transform: none; } }
  @keyframes pop { from { opacity: 0; transform: scale(.6); } to { opacity: 1; transform: scale(1); } }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
