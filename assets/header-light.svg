<style>
  .t { font: 800 70px 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; fill: #1f2328; text-anchor: middle; }
  .idot { transform-origin: 0px 8px; animation: land 1.62s 1s both; }
  .stem { animation: give 1.62s 1s both; }
  .hop { transform-origin: 0px 8px; animation: hop 7s 3.4s infinite; }
  .twirl { animation: twirl 7s 3.4s infinite; }
  .sub { font: 400 19px 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; fill: #59636e; }
  .tag { font: 400 14px ui-monospace, 'SF Mono', 'Cascadia Code', Consolas, monospace; fill: #59636e; letter-spacing: 1.5px; }
  .in { animation: rise .9s cubic-bezier(.2,.8,.2,1) both; }
  .scene { transform-box: fill-box; transform-origin: center; animation: appear 1.4s cubic-bezier(.2,.8,.2,1) .3s both; }
  .dust { fill: #8c959f; }
  .orbit { fill: none; stroke: #59636e; stroke-width: 1.2; stroke-dasharray: 2 6; stroke-linecap: round; animation: march 4s linear infinite; }
  .far { opacity: .35; } .near { opacity: .6; }
  .spots { fill: #8f3620; opacity: .32; animation: spin 40s linear infinite; }
  .cap { fill: #fff7f2; opacity: .9; }
  .spark { fill: #d4920f; transform-box: fill-box; transform-origin: center; animation: twinkle 2.8s ease-in-out infinite alternate both; }
  .m-body { fill: #8b74e6; } .m-crater { fill: #7259d8; } .m-blush { fill: #f4a6c4; opacity: .85; }
  .m-halo { fill: url(#m-halo); }
  .m-eye { fill: #1f2328; transform-box: fill-box; transform-origin: center; animation: m-blink 3.8s infinite; }
  .m-glint { fill: #fff; }
  .m-chomp { fill: #1f2328; transform-box: fill-box; transform-origin: center; animation: m-chomp .3s ease-in-out infinite alternate; }
  .m-smile { fill: none; stroke: #1f2328; stroke-width: 1.5; stroke-linecap: round; }
  @keyframes m-blink { 0%, 93%, 100% { transform: scaleY(1); } 96% { transform: scaleY(.1); } }
  @keyframes m-chomp { from { transform: scaleY(.3); } to { transform: scaleY(1); } }
  @keyframes land { 0.0% { transform: translateY(-100.0px) scale(0.8,1.25); animation-timing-function: cubic-bezier(.55,0,1,.55); } 24.7% { transform: translateY(6.7px) scale(0.86,1.18); animation-timing-function: cubic-bezier(0,.55,.45,1); } 30.9% { transform: translateY(13.6px) scale(1.42,0.58); animation-timing-function: cubic-bezier(0,.55,.45,1); } 38.3% { transform: translateY(-6.0px) scale(0.88,1.14); animation-timing-function: cubic-bezier(0,.55,.45,1); } 49.4% { transform: translateY(-26.0px) scale(1,1); animation-timing-function: cubic-bezier(.55,0,1,.55); } 61.7% { transform: translateY(6.7px) scale(0.94,1.06); animation-timing-function: cubic-bezier(0,.55,.45,1); } 66.0% { transform: translateY(9.1px) scale(1.18,0.82); animation-timing-function: cubic-bezier(0,.55,.45,1); } 72.8% { transform: translateY(-2.0px) scale(0.97,1.04); animation-timing-function: cubic-bezier(0,.55,.45,1); } 80.2% { transform: translateY(-6.0px) scale(1,1); animation-timing-function: ease-in-out; } 90.1% { transform: translateY(1.0px) scale(1.04,0.96); animation-timing-function: ease-out; } 100.0% { transform: translateY(0.0px) scale(1,1); animation-timing-function: linear; } }
  @keyframes give { 0.0% { transform: scale(1,1); animation-timing-function: linear; } 24.7% { transform: scale(1,1); animation-timing-function: cubic-bezier(0,.55,.45,1); } 30.9% { transform: scale(1.05,0.86); animation-timing-function: ease-in-out; } 38.3% { transform: scale(0.98,1.05); animation-timing-function: ease-in-out; } 45.7% { transform: scale(1.01,0.98); animation-timing-function: ease-in-out; } 53.1% { transform: scale(1,1); animation-timing-function: linear; } 61.7% { transform: scale(1,1); animation-timing-function: cubic-bezier(0,.55,.45,1); } 66.0% { transform: scale(1.02,0.95); animation-timing-function: ease-in-out; } 72.8% { transform: scale(1,1.01); animation-timing-function: ease-in-out; } 80.2% { transform: scale(1,1); animation-timing-function: linear; } 100.0% { transform: scale(1,1); animation-timing-function: linear; } }
  @keyframes hop { 0%, 76% { transform: none; animation-timing-function: ease-out; }
    79% { transform: translateY(0) scale(1.16,.82); animation-timing-function: cubic-bezier(0,.55,.45,1); }
    83% { transform: translateY(-5px) scale(.9,1.12); animation-timing-function: ease-out; }
    89% { transform: translateY(-16px) scale(1,1); animation-timing-function: cubic-bezier(.55,0,1,.55); }
    94% { transform: translateY(0) scale(.95,1.05); animation-timing-function: ease-out; }
    96.5% { transform: translateY(0) scale(1.1,.9); animation-timing-function: ease-in-out; } 100% { transform: none; } }
  @keyframes twirl { 0%, 82% { transform: rotate(0deg); animation-timing-function: cubic-bezier(.45,0,.55,1); } 93%, 100% { transform: rotate(360deg); } }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @keyframes appear { from { opacity: 0; transform: scale(.92); } to { opacity: 1; transform: none; } }
  @keyframes march { to { stroke-dashoffset: -32; } }
  @keyframes spin { to { transform: translateX(112px); } }
  @keyframes twinkle { from { opacity: .15; transform: scale(.35); } to { opacity: .9; transform: scale(1); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
